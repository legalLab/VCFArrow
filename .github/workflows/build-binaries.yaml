name: Build package binaries

# VCFArrow's compiled code links only Rcpp and zlib (both provided by the R
# toolchain), so the binaries need no bundled system libraries. Arrow support
# comes from the 'arrow' R package, installed by users as a regular dependency.
#
# Runs on: tag pushes (v*) and manual dispatch. Binaries are always uploaded
# as build artifacts; on a tag push they're also attached to a GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  R_KEEP_PKG_SOURCE: yes

jobs:
  binary:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: VCFArrow-macOS-binary
            pattern: VCFArrow_*.tgz
          - os: windows-latest
            artifact: VCFArrow-windows-binary
            pattern: VCFArrow_*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Build binary package
        shell: bash
        run: R CMD INSTALL --build --no-multiarch .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
