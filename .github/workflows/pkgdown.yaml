# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
name: pkgdown.yaml
permissions: read-all
jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Apache Arrow C++ (required to compile VCFArrow's src/)
        run: |
          sudo apt update
          sudo apt install -y -V ca-certificates lsb-release wget
          wget https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt install -y -V ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt update
          sudo apt install -y -V libarrow-dev libparquet-dev libarrow-dataset-dev libarrow-acero-dev

      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Update home page
        # pkgdown builds the home page from pkgdown/index.md: the README's logo
        # heading and badges, then the vignette (vignettes/VCFArrow.md) without
        # its title block, with the photo taken from man/figures
        run: |
          mkdir -p pkgdown
          {
            echo '<!-- pkgdown/index.md (the pkgdown home page) is generated from vignettes/VCFArrow.md; see the "Update home page" step in .github/workflows/pkgdown.yaml -->'
            echo
            sed -n '/^# VCFArrow/,/badges: end/p' README.md
            echo
            sed -n '/^# /,$p' vignettes/VCFArrow.md | sed 's#](P_vaillantii.jpeg)#](man/figures/P_vaillantii.jpeg)#'
          } > pkgdown/index.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
          